@if (mostraModale) {
  <div class="overlay">
    <div class="modale-box">

      <div class="sc-brand-icon" style="font-size: 4rem; color: var(--sc-primary-color);">🐾</div>
      <h2>Benvenuto su Street Cats! </h2>
      <p>Aiutaci a proteggere i gatti randagi della tua città. È facile! Registrati, cerca l'indirizzo o clicca direttamente sulla mappa per segnalare un gattino avvistato.</p>
      <button (click)="chiudiModale()">Inizia!</button>
    </div>
  </div>
}
